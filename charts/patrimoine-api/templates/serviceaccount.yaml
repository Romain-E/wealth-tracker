{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patrimoine.serviceAccountName" . }}
  labels:
    {{- include "patrimoine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never talks to the Kubernetes API, so it gets no token to do so with.
automountServiceAccountToken: false
{{- end }}
