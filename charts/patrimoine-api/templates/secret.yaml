{{- /*
Created only when no existing Secret is named. Convenient for demos; for anything real, point
database.existingSecret at a Secret managed outside Helm, so the password is neither in a values
file nor in the release history stored in the cluster.
*/ -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patrimoine.databaseSecret" . }}
  labels:
    {{- include "patrimoine.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "database.username is required when database.existingSecret is empty" .Values.database.username | quote }}
  password: {{ required "database.password is required when database.existingSecret is empty" .Values.database.password | quote }}
{{- end }}
